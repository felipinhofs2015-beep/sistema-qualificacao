<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema de Qualificação</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{font-family:Arial;margin:0;text-align:center}
header{background:#2c3e50;color:white;padding:15px}
button{padding:6px 12px;margin:3px;cursor:pointer}
.tela{display:none;padding:20px}
#operacao{display:block}
#resultado{margin-top:30px;padding:40px;border-radius:15px;color:white;display:none}
.apto{background:#27ae60}
.naoapto{background:#c0392b}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:8px}
canvas{margin-top:5px}
</style>
</head>
<body>

<header>
<h1>Sistema de Qualificação</h1>
<button onclick="irOperacao()">Modo Operação</button>
<button onclick="loginAdmin()">Modo Administração</button>
</header>

<div id="operacao" class="tela">

<h2>Leitura</h2>
<input type="text" id="leitura" autofocus placeholder="Passe o código">

<div id="resultado">
<h2 id="status"></h2>
<h1 id="nome"></h1>
<p id="validade"></p>
</div>

</div>

<div id="admin" class="tela">

<h2>Cadastro</h2>

<input type="text" id="nomeCadastro" placeholder="Nome">
<input type="date" id="validadeCadastro">
<button onclick="cadastrar()">Cadastrar</button>

<h2>Operadores Cadastrados</h2>

<table>
<thead>
<tr>
<th>Código</th>
<th>Nome</th>
<th>Validade</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="listaOperadores"></tbody>
</table>

</div>

<script>

let operadores = JSON.parse(localStorage.getItem("operadores")) || {};
let contador = parseInt(localStorage.getItem("contador")) || 1;
const senhaAdmin="1234";

function salvar(){
localStorage.setItem("operadores",JSON.stringify(operadores));
localStorage.setItem("contador",contador);
}

function gerarCodigo(){
let ano=new Date().getFullYear();
let numero=String(contador).padStart(3,"0");
contador++;
return "OP"+ano+numero;
}

function cadastrar(){
let nome=document.getElementById("nomeCadastro").value;
let validade=document.getElementById("validadeCadastro").value;
if(!nome||!validade){alert("Preencha tudo");return;}
let codigo=gerarCodigo();
operadores[codigo]={nome,validade};
salvar();
atualizarLista();
}

function atualizarLista(){
let tbody=document.getElementById("listaOperadores");
tbody.innerHTML="";
for(let codigo in operadores){
let op=operadores[codigo];

let linha=`
<tr>
<td>${codigo}</td>
<td>${op.nome}</td>
<td>${op.validade}</td>
<td>
<button onclick="editar('${codigo}')">Editar</button>
<button onclick="excluirOperador('${codigo}')">Excluir</button>
<br>
<svg id="bar_${codigo}"></svg>
<canvas id="qr_${codigo}"></canvas>
</td>
</tr>
`;
tbody.innerHTML+=linha;
}

for(let codigo in operadores){
JsBarcode("#bar_"+codigo,codigo,{width:2,height:40});
let url=window.location.origin+window.location.pathname+"?codigo="+codigo;
QRCode.toCanvas(document.getElementById("qr_"+codigo),url,{width:80});
}
}

function editar(codigo){
let novoNome=prompt("Novo nome:",operadores[codigo].nome);
if(novoNome!==null){
let novaValidade=prompt("Nova validade (AAAA-MM-DD):",operadores[codigo].validade);
if(novaValidade!==null){
operadores[codigo].nome=novoNome;
operadores[codigo].validade=novaValidade;
salvar();
atualizarLista();
}
}
}

function excluirOperador(codigo){
if(confirm("Excluir operador?")){
delete operadores[codigo];
salvar();
atualizarLista();
}
}

document.getElementById("leitura").addEventListener("keydown",function(e){
if(e.key==="Enter"){
validar(this.value.trim());
this.value="";
}
});

function validar(codigo){
let op=operadores[codigo];
if(!op){alert("Não encontrado");return;}
let hoje=new Date();
let validade=new Date(op.validade);
let resultado=document.getElementById("resultado");
resultado.style.display="block";
document.getElementById("nome").innerText=op.nome;
document.getElementById("validade").innerText="Validade: "+op.validade;
document.getElementById("status").style.fontSize="80px";
document.getElementById("nome").style.fontSize="50px";

if(validade>=hoje){
resultado.className="apto";
document.getElementById("status").innerText="APTO";
}else{
resultado.className="naoapto";
document.getElementById("status").innerText="NÃO APTO";
}
}

function irOperacao(){
document.getElementById("operacao").style.display="block";
document.getElementById("admin").style.display="none";
}

function loginAdmin(){
let senha=prompt("Senha admin:");
if(senha===senhaAdmin){
document.getElementById("admin").style.display="block";
document.getElementById("operacao").style.display="none";
atualizarLista();
}else{alert("Senha incorreta");}
}

window.onload=function(){
atualizarLista();
const params=new URLSearchParams(window.location.search);
const codigo=params.get("codigo");
if(codigo){validar(codigo);}
};

<!-- Firebase -->
<script type="module">

// Importações Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 COLE AQUI SUAS CONFIGURAÇÕES
const firebaseConfig = {
  apiKey: "AIzaSyCQYFMqG1eGU6nZKls4dDW4Fma61vR2BpA",
  authDomain: "sistema-qualificacao.firebaseapp.com",
  projectId: "sistema-qualificacao",
  storageBucket: "sistema-qualificacao.firebasestorage.app",
  messagingSenderId: "715950949355",
  appId: "1:715950949355:web:1cd53d33e95bf1e8338fae"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Referência da coleção
const funcionariosRef = collection(db, "funcionarios");

// 🔄 Atualização em tempo real
onSnapshot(funcionariosRef, (snapshot) => {
    console.log("Banco sincronizado");
});

window.db = db;
window.funcionariosRef = funcionariosRef;

</script>


</body>
</html>
