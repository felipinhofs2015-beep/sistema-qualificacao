<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema de Qualificação</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{font-family:Arial;margin:0;text-align:center}
header{background:#2c3e50;color:white;padding:15px}
button{padding:6px 12px;margin:3px;cursor:pointer}
.tela{display:none;padding:20px}
#operacao{display:block}
#resultado{margin-top:30px;padding:40px;border-radius:15px;color:white;display:none}
#fotoOperador{width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid rgba(255,255,255,.7);margin:10px auto;display:none}
.apto{background:#27ae60}
.naoapto{background:#c0392b}
table{width:100%;margin-top:20px;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:8px}
canvas{margin-top:5px}
</style>
</head>
<body>

<header>
<h1>Sistema de Qualificação</h1>
<button id="btnOperacao">Modo Operação</button>
<button id="btnAdmin">Modo Administração</button>
</header>

<div id="operacao" class="tela">
<h2>Leitura</h2>
<input type="text" id="leitura" autofocus placeholder="Passe o código">

<div id="resultado">
<h2 id="status"></h2>
<h1 id="nome"></h1>
<img id="fotoOperador" alt="Foto do operador">
<p id="validade"></p>
</div>
</div>

<div id="admin" class="tela">
<h2>Cadastro</h2>
<input type="text" id="nomeCadastro" placeholder="Nome">
<input type="date" id="validadeCadastro">
<button onclick="cadastrar()">Cadastrar</button>
<input type="file" id="fotoCadastro" accept="image/*">

<h2>Operadores Cadastrados</h2>
<table>
<thead>
<tr>
<th>Código</th>
<th>Nome</th>
<th>Validade</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="listaOperadores"></tbody>
</table>
</div>

<script>
const senhaAdmin = "1234";
const STORAGE_KEY = "sq_operadores_local";
let operadores = {};
let firebaseDisponivel = false;
let firebaseApi = null;

window.firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_AUTH_DOMAIN",
  projectId: "SEU_PROJECT_ID",
  storageBucket: "SEU_STORAGE_BUCKET",
  messagingSenderId: "SEU_MESSAGING_SENDER_ID",
  appId: "SEU_APP_ID"
};

function gerarCodigo() {
  return "OP" + Date.now();
}

function configFirebaseValida() {
  const cfg = window.firebaseConfig || {};
  const valores = [cfg.apiKey, cfg.authDomain, cfg.projectId, cfg.storageBucket, cfg.messagingSenderId, cfg.appId];
  if (valores.some((v) => !v || typeof v !== "string")) return false;
  return !valores.some((v) => v.startsWith("SUA_") || v.startsWith("SEU_"));
}

function gerarIdLocal() {
  return "local_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
}

function salvarOperadoresLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(operadores));
}

function carregarOperadoresLocal() {
  const bruto = localStorage.getItem(STORAGE_KEY);
  if (!bruto) return;

  try {
    operadores = JSON.parse(bruto) || {};
  } catch (_erro) {
    operadores = {};
  }
}

function lerArquivoComoDataURL(arquivo) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Falha ao ler imagem."));
    reader.readAsDataURL(arquivo);
  });
}

function irOperacao() {
  document.getElementById("operacao").style.display = "block";
  document.getElementById("admin").style.display = "none";
}

function loginAdmin() {
  const senha = prompt("Senha admin:");
  if (senha === null) return;

  if (senha === senhaAdmin) {
    document.getElementById("admin").style.display = "block";
    document.getElementById("operacao").style.display = "none";
  } else {
    alert("Senha incorreta");
  }
}

function validar(codigo) {
  const op = Object.values(operadores).find((o) => o.codigo === codigo);
  if (!op) {
    alert("Não encontrado");
    return;
  }

  const resultado = document.getElementById("resultado");
  resultado.style.display = "block";

  const hoje = new Date();
  const validade = new Date(op.validade);
  const diasRestantes = Math.ceil((validade - hoje) / (1000 * 60 * 60 * 24));

  document.getElementById("nome").innerText = op.nome;

  const fotoOperador = document.getElementById("fotoOperador");
  if (op.foto) {
    fotoOperador.src = op.foto;
    fotoOperador.style.display = "block";
  } else {
    fotoOperador.removeAttribute("src");
    fotoOperador.style.display = "none";
  }

  document.getElementById("validade").innerHTML =
    "Termina em: " + validade.toLocaleDateString("pt-BR") + "<br>Restam " + diasRestantes + " dias";

  if (validade >= hoje) {
    resultado.className = "apto";
    document.getElementById("status").innerText = "APTO";
  } else {
    resultado.className = "naoapto";
    document.getElementById("status").innerText = "NÃO APTO";
  }
}

function atualizarLista() {
  const tbody = document.getElementById("listaOperadores");
  tbody.innerHTML = "";

  for (const id in operadores) {
    const op = operadores[id];
    const linha = `
      <tr>
        <td>${op.codigo}</td>
        <td>${op.foto ? `<img src="${op.foto}" width="50"><br>` : ""}${op.nome}</td>
        <td>${op.validade}</td>
        <td>
          <button onclick="editar('${id}')">Editar</button>
          <button onclick="excluirOperador('${id}')">Excluir</button><br>
          <svg id="bar_${op.codigo}"></svg>
          <canvas id="qr_${op.codigo}"></canvas>
        </td>
      </tr>
    `;
    tbody.innerHTML += linha;
  }

  for (const id in operadores) {
    const op = operadores[id];
    JsBarcode("#bar_" + op.codigo, op.codigo, { width: 2, height: 40 });
    const url = window.location.origin + window.location.pathname + "?codigo=" + op.codigo;
    QRCode.toCanvas(document.getElementById("qr_" + op.codigo), url, { width: 80 });
  }
}

async function cadastrar() {
  const nome = document.getElementById("nomeCadastro").value;
  const validade = document.getElementById("validadeCadastro").value;
  const fotoArquivo = document.getElementById("fotoCadastro").files[0];

  if (!nome || !validade || !fotoArquivo) {
    alert("Preencha tudo");
    return;
  }

  const cadastrarLocal = async () => {
    const id = gerarIdLocal();
    const codigo = gerarCodigo();
    const foto = await lerArquivoComoDataURL(fotoArquivo);

    operadores[id] = {
      codigo,
      nome,
      validade,
      foto,
      criadoEm: new Date().toISOString()
    };

    salvarOperadoresLocal();
    atualizarLista();
  };

  if (firebaseDisponivel && firebaseApi) {
    try {
      const codigo = gerarCodigo();
      const storageRef = firebaseApi.ref(firebaseApi.storage, "fotos/" + codigo);
      await firebaseApi.uploadBytes(storageRef, fotoArquivo);
      const fotoURL = await firebaseApi.getDownloadURL(storageRef);

      await firebaseApi.addDoc(firebaseApi.funcionariosRef, {
        codigo,
        nome,
        validade,
        foto: fotoURL,
        criadoEm: new Date()
      });
    } catch (erro) {
      console.error("Falha no cadastro via Firebase, salvando localmente:", erro);
      await cadastrarLocal();
      alert("Firebase indisponível no momento. Cadastro salvo localmente.");
    }
  } else {
    await cadastrarLocal();
    alert("Cadastro salvo localmente (Firebase indisponível).\nConfigure firebaseConfig para sincronizar na nuvem.");
  }

  document.getElementById("nomeCadastro").value = "";
  document.getElementById("validadeCadastro").value = "";
  document.getElementById("fotoCadastro").value = "";
}

async function editar(id) {
  const op = operadores[id];
  const novoNome = prompt("Novo nome:", op.nome);
  if (novoNome === null) return;

  const novaValidade = prompt("Nova validade (AAAA-MM-DD):", op.validade);
  if (novaValidade === null) return;

  if (firebaseDisponivel && firebaseApi && !String(id).startsWith("local_")) {
    await firebaseApi.updateDoc(firebaseApi.doc(firebaseApi.db, "funcionarios", id), {
      nome: novoNome,
      validade: novaValidade
    });
  } else {
    operadores[id].nome = novoNome;
    operadores[id].validade = novaValidade;
    salvarOperadoresLocal();
    atualizarLista();
  }
}

async function excluirOperador(id) {
  if (!confirm("Excluir operador?")) return;

  if (firebaseDisponivel && firebaseApi && !String(id).startsWith("local_")) {
    await firebaseApi.deleteDoc(firebaseApi.doc(firebaseApi.db, "funcionarios", id));
  } else {
    delete operadores[id];
    salvarOperadoresLocal();
    atualizarLista();
  }
}

window.cadastrar = cadastrar;
window.editar = editar;
window.excluirOperador = excluirOperador;
window.configFirebaseValida = configFirebaseValida;
window.setFirebaseApi = function setFirebaseApi(api) {
  firebaseApi = api;
  firebaseDisponivel = configFirebaseValida();

  if (!firebaseDisponivel) return;

  firebaseApi.onSnapshot(firebaseApi.funcionariosRef, (snapshot) => {
    operadores = {};
    snapshot.forEach((docSnap) => {
      operadores[docSnap.id] = docSnap.data();
    });
    atualizarLista();
  });
};

window.addEventListener("DOMContentLoaded", () => {
  carregarOperadoresLocal();
  atualizarLista();

  document.getElementById("btnOperacao").addEventListener("click", irOperacao);
  document.getElementById("btnAdmin").addEventListener("click", loginAdmin);
  document.getElementById("leitura").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      validar(this.value.trim());
      this.value = "";
    }
  });

  const params = new URLSearchParams(window.location.search);
  const codigo = params.get("codigo");
  if (codigo) validar(codigo);
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

try {
  if (!window.configFirebaseValida || !window.configFirebaseValida()) {
    console.warn("Firebase não configurado: usando modo local.");
  } else {
    const app = initializeApp(window.firebaseConfig);
  const db = getFirestore(app);
  const funcionariosRef = collection(db, "funcionarios");
  const storage = getStorage(app);

    window.setFirebaseApi({
      db,
      funcionariosRef,
      storage,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      onSnapshot,
      ref,
      uploadBytes,
      getDownloadURL
    });
  }
} catch (erro) {
  console.error("Falha ao inicializar Firebase:", erro);
}
</script>

</body>
</html>
